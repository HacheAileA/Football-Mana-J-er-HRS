# Home
home.new_game=Commencer une nouvelle partie
home.rules=Règles
home.rules_title=Règles du Jeu - Football Mana-J-er
home.rules_event=Bienvenue Coach, voici les règles : \n\n\
1. MOTEUR DE MATCH : Les actions dépendent des statistiques moyennes de votre équipe face à l'adversaire. Plus votre moyenne collective est haute, plus vos chances de marquer augmentent.\n\n\
2. CONDITION & REMPLACEMENTS : L'endurance est cruciale ! Un joueur fatigué (TIRED) ou blessé (INJURY) voit ses statistiques divisées par 2. Profitez de la pause à la mi-temps (45e minute) pour faire des changements et apporter de l'énergie à votre équipe.\n\n\
3. FINANCE & MERCATO : Économisez pour acheter des stars du marché à plusieurs millions ! Vos gains de match sont dynamiques :\n\
   • Base (Droits TV & Billetterie) : +80 000 $\n\
   • Prime offensive : +40 000 $ par but marqué\n\
   • Malus défensif : -15 000 $ par but encaissé\n\
   • Résultat : Victoire (+250k $) | Nul (+70k $) | Défaite (+20k $)\n\
   • Sécurité : Un minimum de 30 000 $ est garanti par match pour éviter la faillite de votre club.\n\n\
4. INFRASTRUCTURES : Améliorez votre centre d'entraînement pour booster les statistiques de vos joueurs et accélérer leur vitesse de récupération.\n\n\
5. QUÊTES ET MESSAGERIE : Suivez les quêtes de la direction et consultez régulièrement vos mails pour recevoir les rapports médicaux d'après-match, les confirmations de vos transferts ainsi que le résultat de vos matchs.\n\n\
Coach, c'est à votre tour d'entrer en jeu ! J'espère que vous êtes prêt à relever le défi !\n\n\
Cordialement, la direction.

