# Home
home.new_game=Inizia una nuova partita
home.rules=Regole
home.rules_title=Regole del gioco - Football Mana-J-er
home.rules_event=Benvenuto, Coach, ecco le regole: \n\n\
1. MECCANICA DI GIOCO: Le azioni dipendono dalle statistiche medie della tua squadra rispetto all'avversario. Più alta è la tua media complessiva, maggiori sono le tue possibilità di segnare.\n\n\
2. CONDIZIONE FISICA E SOSTITUZIONI: La resistenza è fondamentale! Un giocatore stanco (TIRED) o infortunato (INJURY) vede le sue statistiche dimezzate. Approfitta dell'intervallo (45° minuto) per effettuare cambi e dare nuova energia alla tua squadra.\n\n\
3. FINANZE E MERCATO: Risparmia per acquistare stelle del mercato da milioni di dollari! I tuoi guadagni di partita sono dinamici:\n\
   • Base (Diritti TV e Biglietteria): +80.000 $\n\
   • Bonus offensivo: +40.000 $ per ogni gol segnato\n\
   • Penalità difensiva: -15.000 $ per ogni gol subito\n\
   • Risultato: Vittoria (+250.000 $) | Pareggio (+70.000 $) | Sconfitta (+20.000 $)\n\
   • Sicurezza: è garantito un minimo di 30.000 $ a partita per evitare il fallimento della tua squadra.\n\n\
4. INFRASTRUTTURE: Migliora il tuo centro di allenamento per potenziare le statistiche dei tuoi giocatori e accelerarne la velocità di recupero.\n\n\
5. MISSIONI E POSTA: Segui le missioni assegnate dalla dirigenza e controlla regolarmente la tua posta per ricevere i referti medici post-partita, le conferme dei tuoi trasferimenti e i risultati delle tue partite.\n\n\
Allenatore, tocca a te entrare in campo! Spero che tu sia pronto ad affrontare la sfida!\n\n\
Cordiali saluti, la direzione.

