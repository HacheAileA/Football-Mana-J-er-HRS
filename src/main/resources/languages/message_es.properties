# Home
home.new_game=Empezar una nueva partida
home.rules=Reglas
home.rules_title=Reglas del juego - Football Mana-J-er
home.rules_event=Bienvenido, entrenador. Estas son las reglas: \n\n\
1. MECÁNICA DEL PARTIDO: Las jugadas dependen de las estadísticas medias de tu equipo frente al rival. Cuanto más alta sea tu media colectiva, mayores serán tus posibilidades de marcar.\n\n\
2. CONDICIÓN FÍSICA Y SUSTITUCIONES: ¡La resistencia es crucial! Un jugador cansado (TIRED) o lesionado (INJURY) ve sus estadísticas reducidas a la mitad. Aprovecha el descanso del medio tiempo (minuto 45) para hacer cambios y aportar energía a tu equipo.\n\n\
3. FINANZAS Y MERCADO DE FICHAJES: ¡Ahorra para comprar estrellas del mercado por varios millones! Tus ganancias por partido son dinámicas:\n\
   • Base (derechos de televisión y taquilla): +80 000 $\n\
   • Bonificación ofensiva: +40 000 $ por cada gol marcado\n\
   • Penalización defensiva: -15 000 $ por cada gol encajado\n\
   • Resultado: Victoria (+250 000 $) | Empate (+70 000 $) | Derrota (+20 000 $)\n\
   • Seguridad: Se garantiza un mínimo de 30 000 $ por partido para evitar la quiebra de tu club.\n\n\
4. INFRAESTRUCTURAS: Mejora tu centro de entrenamiento para potenciar las estadísticas de tus jugadores y acelerar su velocidad de recuperación.\n\n\
5. MISIONES Y CORREO: Sigue las misiones de la directiva y consulta regularmente tu correo para recibir los informes médicos posteriores al partido, las confirmaciones de tus fichajes y los resultados de tus partidos.\n\n\
¡Entrenador, te toca entrar en juego! ¡Espero que estés listo para afrontar el reto!\n\n\
Saludos cordiales, la directiva.

