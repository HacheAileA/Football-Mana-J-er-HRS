# Home
home.new_game=Start new game
home.rules=Rules
home.rules_title=Game Rules - Football Mana-J-er
home.rules_event=Welcome Coach, here are the rules: \n\n\
1. MATCH ENGINE: Match actions depend on your team's average statistics against the opponent. The higher your collective average, the higher your chances of scoring.\n\n\
2. CONDITION & SUBSTITUTIONS: Stamina is crucial! A tired (TIRED) or injured (INJURY) player has their statistics halved. Take advantage of the half-time break (45th minute) to make substitutions and bring energy to your team.\n\n\
3. FINANCE & TRANSFER MARKET: Save up to buy transfer market stars worth several millions! Your match earnings are dynamic:\n\
   • Base (TV Rights & Ticketing): +80,000 $\n\
   • Attacking Bonus: +40,000 $ per goal scored\n\
   • Defensive Penalty: -15,000 $ per goal conceded\n\
   • Result: Win (+250k $) | Draw (+70k $) | Loss (+20k $)\n\
   • Safety Net: A minimum of 30,000 $ is guaranteed per match to prevent your club from going bankrupt.\n\n\
4. INFRASTRUCTURE: Upgrade your training center to boost your players' stats and speed up their recovery rate.\n\n\
5. QUESTS & INBOX: Follow the board's quests and regularly check your emails to receive post-match medical reports, transfer confirmations, and match results.\n\n\
Coach, it's your turn to step up! I hope you're ready to take on the challenge!\n\n\
Sincerely, the Board.

